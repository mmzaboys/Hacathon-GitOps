apiVersion: apps/v1
kind: Deployment
metadata:
  name: opensearch-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: opensearch
  template:
    metadata:
      labels:
        app: opensearch
    spec:
      securityContext:
        fsGroup: 1000
      initContainers:
      - name: fix-volume-permissions
        image: busybox:1.36
        command:
        - sh
        - -c
        - chown -R 1000:1000 /usr/share/opensearch/data
        securityContext:
          runAsUser: 0
        volumeMounts:
        - name: opensearch-data
          mountPath: /usr/share/opensearch/data
      containers:
      - name: opensearch
        image: opensearchproject/opensearch:3.5.0
        resources:
          requests:
            cpu: 300m
            memory: 1Gi
          limits:
            cpu: 600m
            memory: 1Gi
        ports:
        - containerPort: 9200
          name: http
        - containerPort: 9600
          name: performance
        env:
          - name: discovery.type
            value: single-node
          - name: OPENSEARCH_JAVA_OPTS
            value: "-Xms512m -Xmx512m"
          - name: plugins.security.disabled
            value: "true"
          - name: DISABLE_INSTALL_DEMO_CONFIG
            value: "true"
        readinessProbe:
          httpGet:
            path: /_cluster/health
            port: 9200
          initialDelaySeconds: 60
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 30
        startupProbe:
          httpGet:
            path: /_cluster/health
            port: 9200
          initialDelaySeconds: 60
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 30
        volumeMounts:
        - name: opensearch-data
          mountPath: /usr/share/opensearch/data
      volumes:
      - name: opensearch-data
        persistentVolumeClaim:
          claimName: opensearch-data
             
--- 
apiVersion: v1
kind: Service
metadata:
  name: opensearch-service
spec:
  selector: 
    app: opensearch
  ports:
    - name: http
      protocol: TCP
      port: 9200
      targetPort: 9200
    - name: performance
      protocol: TCP
      port: 9600
      targetPort: 9600
  type: ClusterIP
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: opensearch-data
spec:
  accessModes:
    - ReadWriteOnce 
  resources:
    requests:
      storage: 2Gi
  storageClassName: ebs-sc
