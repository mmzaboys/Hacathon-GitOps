apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout-deployment
spec:
  selector:
    matchLabels:
      app: checkout-redis
  
  replicas: 1
  template:
    metadata:
      labels:
        app: checkout-redis
    spec:
      restartPolicy: Always
      containers:
      - name: redis
        image: redis:6.0-alpine
        ports:
        - containerPort: 6379
          name: redis
        
        resources:
          requests:
            memory: 128Mi
            cpu: 100m
          limits:
            memory: 256Mi
            cpu: 500m  
        startupProbe:
          exec:
            command:
              - redis-cli
              - ping
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 5
          failureThreshold: 6
        livenessProbe:
          exec:
            command:
              - redis-cli
              - ping
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 5
          failureThreshold: 6 
        readinessProbe:
          exec:
            command:
              - redis-cli
              - ping
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 5
          failureThreshold: 6
---
apiVersion: v1
kind: Service
metadata:
  name: checkout-service-redis
spec:
  selector:
    app: checkout-redis
  ports:
    - protocol: TCP
      port: 6379
      targetPort: 6379
