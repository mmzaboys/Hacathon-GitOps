apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: rabbitmq
spec:
  serviceName: rabbitmq-service
  replicas: 1
  selector:
    matchLabels:
      app: rabbitmq
  template:
    metadata:
      labels:
        app: rabbitmq
    spec:
      securityContext:
        fsGroup: 999
        runAsUser: 999
      initContainers:
      - name: fix-cookie-permissions
        image: busybox:1.36
        securityContext:
          runAsUser: 0
        command:
        - sh
        - -c
        - |
          chown -R 999:999 /var/lib/rabbitmq
          if [ -f /var/lib/rabbitmq/.erlang.cookie ]; then
            chmod 600 /var/lib/rabbitmq/.erlang.cookie
          fi
        volumeMounts:
        - name: rabbitmq-data
          mountPath: /var/lib/rabbitmq
      containers:
      - name: rabbitmq
        image: rabbitmq:3-management
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "1Gi"
            cpu: "300m"
        ports:
        - containerPort: 5672
          name: amqp
        - containerPort: 15672
          name: management
        env:
         - name: RABBITMQ_DEFAULT_USER
           valueFrom:
             configMapKeyRef:
               name: rabbitmq-config
               key: RABBITMQ_DEFAULT_USER
         - name: RABBITMQ_DEFAULT_PASS
           valueFrom:
             secretKeyRef:
               name: rabbitmq-secret
               key: RABBITMQ_DEFAULT_PASS      
        volumeMounts:
         - name: rabbitmq-data
           mountPath: /var/lib/rabbitmq
  volumeClaimTemplates:
      - metadata:
          name: rabbitmq-data
        spec:
          accessModes: [ "ReadWriteOnce" ]  
          storageClassName: "ebs-sc"
          resources:
            requests:
              storage: 1Gi 
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq-service
spec:
  selector:
    app: rabbitmq
  clusterIP: None
  ports:
  - name: amqp
    port: 5672
    targetPort: 5672
  - name: management
    port: 15672
    targetPort: 15672
--- 
apiVersion: v1
kind: ConfigMap
metadata:
  name: rabbitmq-config 
data:
  RABBITMQ_DEFAULT_USER: rabbitmq