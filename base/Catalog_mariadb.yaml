apiVersion: v1
kind: ConfigMap
metadata:
  name: mariadb-cm
data:
  MYSQL_DATABASE: catalogdb
  MYSQL_USER: catalog_user

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: catalogdb-statefulset
spec:
  serviceName: catalogdb-service
  replicas: 1

  selector:
    matchLabels:
      app: catalogdb

  template:
    metadata:
      labels:
        app: catalogdb

    spec:
      containers:

        # =========================
        # MariaDB
        # =========================
        - name: mariadb
          image: mariadb:10.9

          ports:
            - name: mysql
              containerPort: 3306

          env:
            - name: MYSQL_DATABASE
              valueFrom:
                configMapKeyRef:
                  name: mariadb-cm
                  key: MYSQL_DATABASE

            - name: MYSQL_USER
              valueFrom:
                configMapKeyRef:
                  name: mariadb-cm
                  key: MYSQL_USER

            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: catalogdb-secret
                  key: MYSQL_PASSWORD

            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: catalogdb-secret
                  key: MYSQL_ROOT_PASSWORD

          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - mysqladmin ping -h localhost -u "$MYSQL_USER" -p"$MYSQL_PASSWORD"
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5

          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - mysqladmin ping -h localhost -u "$MYSQL_USER" -p"$MYSQL_PASSWORD"
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 5

          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi

          volumeMounts:
            - name: catalogdb-storage
              mountPath: /var/lib/mysql

        - name: mysqld-exporter
          image: prom/mysqld-exporter:v0.19.0

          args:
            - "--config.my-cnf=/etc/mysqld-exporter/my.cnf"

          volumeMounts:
            - name: exporter-cnf
              mountPath: /etc/mysqld-exporter
              readOnly: true

          ports:
            - name: metrics
              containerPort: 9104
          # ... readinessProbe / livenessProbe / resources unchanged

        
          readinessProbe:
            httpGet:
              path: /metrics
              port: metrics
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 5

          livenessProbe:
            httpGet:
              path: /metrics
              port: metrics
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5

          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi


      volumes:
        - name: exporter-cnf
          secret:
            secretName: catalogdb-exporter-cnf

  volumeClaimTemplates:
    - metadata:
        name: catalogdb-storage
      spec:
        accessModes:
          - ReadWriteOnce

        storageClassName: standard

        resources:
          requests:
            storage: 512Mi

---
apiVersion: v1
kind: Service
metadata:
  name: catalogdb-service
  labels:
    app: catalogdb

spec:
  clusterIP: None

  selector:
    app: catalogdb

  ports:
    - name: mysql
      port: 3306
      targetPort: 3306

    - name: metrics
      port: 9104
      targetPort: 9104

---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: catalogdb-servicemonitor
  labels:
    release: prometheus

spec:
  selector:
    matchLabels:
      app: catalogdb

  endpoints:
    - port: metrics
      path: /metrics
      interval: 15s