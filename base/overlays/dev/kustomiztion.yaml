apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base/
namespace: default  
patches:
  - target:
      kind: Deployment
      name: retail-store-ui
    patches: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: retail-store-ui
        labels:
          app: retail-store-ui
      spec:
        replicas: 4