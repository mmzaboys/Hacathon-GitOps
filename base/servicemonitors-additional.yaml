# opensearch-deployment is intentionally NOT covered here: stock OpenSearch has no
# built-in Prometheus endpoint. To scrape it you'd need the opensearch-project
# "prometheus-exporter" plugin installed in the image, exposing /_prometheus/metrics
# on port 9200 — happy to wire that up if you add the plugin.