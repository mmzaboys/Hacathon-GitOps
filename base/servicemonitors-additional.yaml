# catalogdb-servicemonitor (Catalog_mariadb.yaml) and dynamodb-servicemonitor (ServiceMonitor.yaml)
# already exist — not duplicated here.
#
# ASSUMPTION: retail-store-cart / catalog / orders / ui are the AWS
# "retail-store-sample" apps (image tags confirm this). Their Java services (cart,
# orders, ui) expose Micrometer metrics at /actuator/prometheus when the
# `management.endpoints.web.exposure.include` property includes "prometheus" — verify
# with `kubectl port-forward` + curl (exec has no shell tools in these images).
# If it 404s, add env var MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE=health,prometheus
# to that Deployment. Catalog (Go) is assumed to expose /metrics the same way.
# CONFIRMED: checkout is actually Node.js (prom-client), not Java — its 404 on
# /actuator gave it away. It exposes plain /metrics, already reflected below.
# Apply service-port-name-patches.yaml BEFORE this file — these ServiceMonitors
# reference the `http`/`metrics` port names added there.

apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: cart-servicemonitor
  labels:
    release: prometheus
spec:
  selector:
    matchLabels:
      app: retail-store-cart
  endpoints:
    - port: http
      path: /actuator/prometheus
      interval: 15s
---
