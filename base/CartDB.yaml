apiVersion: v1
kind: ConfigMap
metadata:
  name: dynamodb-jmx-config
data:
  config.yaml: |
    rules:
      - pattern: ".*"
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: dynamodb-statefulset
spec:
  selector:
    matchLabels:
      app: dynamodb
  serviceName: dynamodb-service
  replicas: 1
  template:
    metadata:
      labels:
        app: dynamodb
    spec:
      restartPolicy: Always
      securityContext:
        fsGroup: 1000
      initContainers:
        - name: fetch-jmx-exporter
          image: busybox:1.36
          command:
            - wget
            - -O
            - /jmx/jmx_prometheus_javaagent.jar
            - https://repo1.maven.org/maven2/io/prometheus/jmx/jmx_prometheus_javaagent/0.20.0/jmx_prometheus_javaagent-0.20.0.jar
          volumeMounts:
            - name: jmx-agent
              mountPath: /jmx
      containers:
        - name: dynamodb
          image: amazon/dynamodb-local:1.20.0
          ports:
            - containerPort: 8000
              name: dynamodb
            - containerPort: 9102
              name: metrics
          securityContext:  
            readOnlyRootFilesystem: true  
            allowPrivilegeEscalation: false
            capabilities:
              drop: 
                - ALL
          args:
            - -Xms128m
            - -Xmx256m
            - -javaagent:/jmx/jmx_prometheus_javaagent.jar=9102:/etc/jmx/config.yaml
            - -jar
            - DynamoDBLocal.jar  
            - -sharedDb   
            - -dbPath
            - /home/dynamodblocal/data
          volumeMounts:
            - name: dynamodb-pvc
              mountPath: /home/dynamodblocal/data
            - name: tmp-volume
              mountPath: /tmp
            - name: jmx-agent
              mountPath: /jmx
            - name: jmx-config
              mountPath: /etc/jmx
          resources:
            requests:
              memory: 256Mi
              cpu: 100m
            limits:
              memory: 512Mi
              cpu: 500m  
          startupProbe:
            tcpSocket:
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 15
          livenessProbe:
            tcpSocket:
              port: 8000
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: 8000
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
      volumes:
        - name: tmp-volume
          emptyDir: {}
        - name: jmx-agent
          emptyDir: {}
        - name: jmx-config
          configMap:
            name: dynamodb-jmx-config
  volumeClaimTemplates:
    - metadata:
        name: dynamodb-pvc
      spec:
        accessModes: [ "ReadWriteOnce" ]
        storageClassName: standard
        resources:
          requests:
            storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: dynamodb-service
  labels:
    app: dynamodb
spec:
  selector:
    app: dynamodb
  ports:
    - protocol: TCP
      name: dynamodb
      port: 8000
      targetPort: 8000
    - protocol: TCP
      name: metrics
      port: 9102
      targetPort: 9102
  clusterIP: None