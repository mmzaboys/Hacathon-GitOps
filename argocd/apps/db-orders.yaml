apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: db-orders
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  source:
    repoURL: https://github.com/mmzaboys/Hacathon-GitOps.git
    targetRevision: Mahmoud/EKS-adjustments
    path: data/orders-db     # its own subfolder, just ordersDB_sts.yaml & rabbitmq_sts.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true