apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: app-order
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: default
  source:
    repoURL: https://github.com/mmzaboys/Hacathon-GitOps.git
    targetRevision: main
    path: services/order   
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true